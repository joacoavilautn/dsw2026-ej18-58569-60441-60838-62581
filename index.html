<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18</title>
</head>
<body>
    <h2>Formulario de Registro</h2>
    
    <form action="">
        <label for="nombre">
            Nombre de Usuario:
        </label>
        <input name="nombre" type="text" id="nombre" required placeholder="Nombre de Usuario">
        <br>
         <label for="contraseña">
            Password:
        </label>
        <input name="contraseña" type="password" id="contraseña" required placeholder="Contraseña">
        <br>
        <button type="submit">
            Enviar
        </button>
    </form>
</body>
</html>
